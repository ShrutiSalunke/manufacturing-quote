{% extends "base.html" %}
{% block title %}Add Process — {{ quote.number }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Add Process to {{ quote.number }}</h1>
<form method="post" class="bg-white border rounded p-3" style="max-width:560px">
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
  {% endfor %}
  <div class="d-flex gap-2 justify-content-end">
    <a class="btn btn-outline-secondary" href="{% url 'quotes:quote_detail' quote.pk %}">Cancel</a>
    <button class="btn mq-btn-theme" type="submit">Continue</button>
  </div>
</form>
{% endblock %}
