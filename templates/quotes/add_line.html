{% extends "base.html" %}
{% block title %}Add Line{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Add line to {{ quote.number }}</h1>
<form method="post" class="bg-white border rounded p-4" style="max-width:640px">
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
  {% endfor %}
  <button class="btn btn-success" type="submit">Add</button>
</form>
{% endblock %}
